### traefik deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-deployment
  labels:
    app: traefik
spec:
  replicas: 3
  selector:
    matchLabels:
      app2: devops1
  template:
    metadata:
      labels:
        app2: devops1
    spec:
      containers:
      - name: traefik
        image: traefik
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service-3
spec:
  type: NodePort
  selector:
    app2: devops1
  ports: 
    - port: 80
      targetPort: 80
      nodePort: 30010
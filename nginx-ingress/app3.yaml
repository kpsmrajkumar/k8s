### harbor-portal deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal-deployment
  labels:
    app3: harbor-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app3: zen3
  template:
    metadata:
      labels:
        app3: zen3
    spec:
      containers:
      - name: harbor-portal
        image: hardened-images/dhi/harbor-portal
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zen-service-3
spec:
  type: NodePort
  selector:
    app3: zen3
  ports: 
    - port: 80
      targetPort: 8080
      nodePort: 30010
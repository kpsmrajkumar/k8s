### nginx deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app2: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app2: zen2
  template:
    metadata:
      labels:
        app2: zen2
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: zen-service-2
spec:
  type: NodePort
  selector:
    app2: zen2
  ports: 
    - port: 80
      targetPort: 80
      nodePort: 30009
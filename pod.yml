apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: zen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zen
  template:
    metadata:
      labels:
        app: zen
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: NodePort
  selector:
    app: zen
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30008

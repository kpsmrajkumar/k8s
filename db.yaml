apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: database
spec:
  serviceName: db-service
  replicas: 1
  selector:
    matchLabels:
      app: database
      tier: backend
  template:
    metadata:
      labels:
        app: database
        tier: backend
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "reriuetteiueit!23345%"
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  labels:
    app: database
spec:
  selector:
    app: database
    tier: backend
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
  type: ClusterIP
